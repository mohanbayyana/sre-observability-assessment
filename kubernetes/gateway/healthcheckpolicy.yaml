apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: sre-observability-healthcheck
  namespace: sre-app
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /health
        port: 8080
  targetRef:
    group: ""
    kind: Service
    name: sre-observability-app
