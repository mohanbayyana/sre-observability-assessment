apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-observability-app
  namespace: sre-app
  labels:
    app: sre-observability-app
  annotations:
    checkov.io/skip1: >-
      CKV_K8S_14=Image tag is dynamically injected by CI using the Git commit SHA.
    checkov.io/skip2: >-
      CKV_K8S_43=Image reference is dynamically generated by the deployment pipeline.

spec:
  replicas: 2

  selector:
    matchLabels:
      app: sre-observability-app

  template:
    metadata:
      labels:
        app: sre-observability-app

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
