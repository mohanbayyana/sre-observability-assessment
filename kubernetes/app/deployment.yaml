apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-observability-app
  namespace: default
  labels:
    app: sre-observability-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: sre-observability-app

  template:
    metadata:
      labels:
        app: sre-observability-app
    spec:
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
