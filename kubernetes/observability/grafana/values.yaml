replicas: 1

testFramework:
  enabled: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: GKE
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboardsConfigMaps:
  default: grafana-dashboards

service:
  type: LoadBalancer
  port: 80
  targetPort: 3000

persistence:
  enabled: true
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

serviceAccount:
  automountServiceAccountToken: false

networkPolicy:
  enabled: true

image:
  pullPolicy: Always

initChownData:
  enabled: false

adminUser: admin

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Managed Prometheus
        uid: managed-prometheus
        type: prometheus
        access: proxy
        url: http://localhost:9090
        isDefault: true
        editable: true

alerting:
  application-alerts.yaml:
    apiVersion: 1

    groups:
      - orgId: 1
        name: application-sre-alerts
        folder: GKE
        interval: 1m

        rules:
          - uid: app-high-error-rate
            title: High Application Error Rate
            condition: C

            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: managed-prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: managed-prometheus
                  editorMode: code
                  expr: >-
                    100 *
                    sum(rate(http_requests_total{status=~"5..",endpoint!="/health",endpoint!="/ready"}[5m]))
                    /
                    clamp_min(
                      sum(rate(http_requests_total{endpoint!="/health",endpoint!="/ready"}[5m])),
                      0.000001
                    )
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A

              - refId: B
                datasourceUid: __expr__
                model:
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  refId: B
                  type: reduce

              - refId: C
                datasourceUid: __expr__
                model:
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  refId: C
                  type: threshold
                  conditions:
                    - evaluator:
                        params:
                          - 5
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query

            noDataState: OK
            execErrState: Error
            for: 5m

            annotations:
              summary: Application 5xx error rate is above 5 percent
              description: More than 5 percent of application requests have been failing for 5 minutes.

            labels:
              severity: warning
              service: sre-observability-app

            isPaused: false

          - uid: app-high-p95-latency
            title: High Application p95 Latency
            condition: C

            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: managed-prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: managed-prometheus
                  editorMode: code
                  expr: >-
                    histogram_quantile(
                      0.95,
                      sum by (le) (
                        rate(
                          http_request_duration_seconds_bucket{
                            endpoint!="/health",
                            endpoint!="/ready"
                          }[5m]
                        )
                      )
                    )
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A

              - refId: B
                datasourceUid: __expr__
                model:
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  refId: B
                  type: reduce

              - refId: C
                datasourceUid: __expr__
                model:
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  refId: C
                  type: threshold
                  conditions:
                    - evaluator:
                        params:
                          - 1
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query

            noDataState: OK
            execErrState: Error
            for: 5m

            annotations:
              summary: Application p95 latency is above 1 second
              description: Application p95 latency has remained above 1 second for 5 minutes.

            labels:
              severity: warning
              service: sre-observability-app

            isPaused: false
