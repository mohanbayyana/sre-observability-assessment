name: Terraform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform CI / Security

    # Run validation and security checks on PRs and pushes.
    # Skip this job for manual Terraform Apply runs.
    if: github.event_name != 'workflow_dispatch'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: mohan-sre-assessment-20261001
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.2.2
        with:
          tflint_version: v0.64.0

      - name: Checkov Terraform scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Render Grafana Kubernetes manifests
        if: ${{ hashFiles('kubernetes/observability/grafana/values.yaml') != '' }}
        working-directory: .
        run: |
          mkdir -p rendered
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm template grafana grafana/grafana \
            --namespace monitoring \
            --values kubernetes/observability/grafana/values.yaml \
            > rendered/grafana.yaml

      - name: Checkov Kubernetes scan
        if: ${{ hashFiles('kubernetes/observability/grafana/values.yaml') != '' }}
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: rendered
          framework: kubernetes
          quiet: true
          soft_fail: false
          skip_check: CKV_K8S_40,CKV_K8S_22,CKV_K8S_43,CKV_K8S_35,CKV_K8S_38

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive

      - name: Run ShellCheck
        shell: bash
        working-directory: .
        run: |
          mapfile -d '' scripts < <(
            find . \
              -type f \
              -name "*.sh" \
              -not -path "./.git/*" \
              -print0
          )

          if (( ${#scripts[@]} > 0 )); then
            printf '%s\n' "${scripts[@]}"
            shellcheck "${scripts[@]}"
          else
            echo "No shell scripts found. Skipping ShellCheck."
          fi

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -no-color

  apply:
    name: Terraform Apply

    # Run infrastructure deployment only when manually triggered from main.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: mohan-sre-assessment-20261001
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      # Verify the multi-cluster Gateway controller is healthy
      # after infrastructure changes are applied.
      - name: Verify multi-cluster Gateway readiness
        working-directory: .
        run: |
          set -euo pipefail

          gcloud container clusters get-credentials \
            gke-primary \
            --region us-east1 \
            --project mohan-sre-assessment-20261001

          echo "=== Waiting for multi-cluster Gateway controller ==="

          kubectl wait \
            --for=condition=Accepted \
            gatewayclass/gke-l7-global-external-managed-mc \
            --timeout=15m

          echo "Multi-cluster Gateway controller is ready."

          kubectl get gatewayclass

          gcloud container fleet ingress describe \
            --project=mohan-sre-assessment-20261001
