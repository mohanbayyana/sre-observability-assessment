name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - "**/*.sh"

  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - "**/*.sh"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform CI / Security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      # ------------------------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Setup Terraform
      # Keep your existing Terraform version if you already specify one.
      # ------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ------------------------------------------------------------
      # 3. Terraform formatting check
      # Fails if .tf files are not properly formatted.
      # ------------------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # ------------------------------------------------------------
      # 4. TFLint
      # Finds Terraform linting issues and bad practices.
      # ------------------------------------------------------------
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.2.2
        with:
          tflint_version: v0.64.0

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive

      # ------------------------------------------------------------
      # 5. Checkov security scan
      # Scans Terraform for security misconfigurations.
      # soft_fail is intentionally FALSE so real findings fail CI.
      # ------------------------------------------------------------
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false

      # ------------------------------------------------------------
      # 6. ShellCheck
      # Checks any shell scripts in the repository.
      # If there are no .sh files yet, this step simply has nothing
      # meaningful to scan.
      # ------------------------------------------------------------
      - name: Run ShellCheck
        shell: bash
        working-directory: .
        run: |
          scripts=$(find . -type f -name "*.sh" -not -path "./.git/*")

          if [ -n "$scripts" ]; then
            echo "$scripts"
            shellcheck $scripts
          else
            echo "No shell scripts found. Skipping ShellCheck."
          fi

      # ------------------------------------------------------------
      # 7. KEEP YOUR EXISTING GCP WIF AUTHENTICATION HERE
      #
      # DO NOT replace your current:
      #   google-github-actions/auth
      #   Workload Identity Provider
      #   Service Account
      #
      # Example location only:
      #
      # - name: Authenticate to Google Cloud
      #   uses: google-github-actions/auth@...
      #   with:
      #     workload_identity_provider: ...
      #     service_account: ...
      # ------------------------------------------------------------

      # >>> KEEP YOUR EXISTING GCP AUTHENTICATION STEP HERE <<<

      # ------------------------------------------------------------
      # 8. Terraform Init
      # Initializes providers and remote GCS backend.
      # ------------------------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # ------------------------------------------------------------
      # 9. Terraform Validate
      # Checks Terraform syntax/configuration.
      # ------------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # ------------------------------------------------------------
      # 10. Terraform Plan
      # Shows what Terraform WOULD change.
      # It does not modify GCP.
      # ------------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -input=false -no-color

      # ------------------------------------------------------------
      # NO TERRAFORM APPLY
      #
      # Feature branches and PRs can never deploy infrastructure
      # from this workflow.
      # ------------------------------------------------------------

      - name: Terraform Plan
        run: terraform plan
