name: App Deploy

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "kubernetes/app/**"
      - "kubernetes/gateway/**"
      - ".github/workflows/app-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Python syntax
        run: |
          python -m py_compile app/app.py

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          pip install \
            yamllint \
            checkov==3.3.20 \
            pip-audit

      - name: Run YAML lint
        run: |
          FAILED=0

          echo "=== yamllint version ==="
          yamllint --version

          for file in \
            kubernetes/app/deployment.yaml \
            kubernetes/app/service.yaml \
            kubernetes/app/namespace.yaml \
            kubernetes/app/networkpolicy.yaml \
            kubernetes/app/podmonitoring.yaml \
            kubernetes/app/serviceexport.yaml \
            kubernetes/gateway/gateway.yaml \
            kubernetes/gateway/httproute.yaml \
            .github/workflows/app-deploy.yml
          do
            echo "=== ${file} ==="

            if ! yamllint -f parsable "${file}"; then
              FAILED=1
            fi
          done

          exit "$FAILED"

      - name: Scan Python dependencies
        run: |
          pip-audit -r app/requirements.txt

      - name: Install actionlint
        run: |
          bash <(
            curl -sSfL \
              https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
          )

      - name: Run actionlint
        run: |
          ./actionlint .github/workflows/app-deploy.yml

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

      - name: Run Checkov Kubernetes scan
        run: |
          checkov \
            -d kubernetes/app \
            --framework kubernetes \
            --compact

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build application image
        env:
          PROJECT_ID: mohan-sre-assessment-20261001
          REGION: us-east1
          REPOSITORY: app-images
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/sre-observability-app:${GITHUB_SHA}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

          docker build \
            -t "${IMAGE_URI}" \
            app

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push application image
        run: |
          docker push "${IMAGE_URI}"

      # ---------------------------------------------------------
      # PRIMARY CLUSTER
      # ---------------------------------------------------------

      - name: Get primary GKE credentials
        run: |
          gcloud container clusters get-credentials \
            gke-primary \
            --region us-east1 \
            --project mohan-sre-assessment-20261001

      - name: Deploy application to primary cluster
        run: |
          kubectl apply -f kubernetes/app/namespace.yaml
          kubectl apply -f kubernetes/app/networkpolicy.yaml

          sed "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|g" \
            kubernetes/app/deployment.yaml \
            | kubectl apply -f -

          kubectl apply -f kubernetes/app/service.yaml
          kubectl apply -f kubernetes/app/podmonitoring.yaml
          kubectl apply -f kubernetes/app/serviceexport.yaml

      - name: Verify primary application rollout
        run: |
          kubectl rollout status \
            deployment/sre-observability-app \
            -n sre-app \
            --timeout=5m

          echo "=== Primary pods ==="
          kubectl get pods \
            -n sre-app \
            -l app=sre-observability-app \
            -o wide

          echo "=== Primary service ==="
          kubectl get service \
            sre-observability-app \
            -n sre-app

          echo "=== Primary ServiceExport ==="
          kubectl get serviceexport \
            sre-observability-app \
            -n sre-app

          echo "=== Primary image ==="
          kubectl get deployment \
            sre-observability-app \
            -n sre-app \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo

      # ---------------------------------------------------------
      # SECONDARY CLUSTER
      # ---------------------------------------------------------

      - name: Get secondary GKE credentials
        run: |
          gcloud container clusters get-credentials \
            gke-secondary \
            --region us-west1 \
            --project mohan-sre-assessment-20261001

      - name: Deploy application to secondary cluster
        run: |
          kubectl apply -f kubernetes/app/namespace.yaml
          kubectl apply -f kubernetes/app/networkpolicy.yaml

          sed "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|g" \
            kubernetes/app/deployment.yaml \
            | kubectl apply -f -

          kubectl apply -f kubernetes/app/service.yaml
          kubectl apply -f kubernetes/app/podmonitoring.yaml
          kubectl apply -f kubernetes/app/serviceexport.yaml

      - name: Verify secondary application rollout
        run: |
          kubectl rollout status \
            deployment/sre-observability-app \
            -n sre-app \
            --timeout=5m

          echo "=== Secondary pods ==="
          kubectl get pods \
            -n sre-app \
            -l app=sre-observability-app \
            -o wide

          echo "=== Secondary service ==="
          kubectl get service \
            sre-observability-app \
            -n sre-app

          echo "=== Secondary ServiceExport ==="
          kubectl get serviceexport \
            sre-observability-app \
            -n sre-app

          echo "=== Secondary image ==="
          kubectl get deployment \
            sre-observability-app \
            -n sre-app \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo

      # ---------------------------------------------------------
      # GLOBAL MULTI-CLUSTER GATEWAY
      # gke-primary is the Fleet config cluster
      # ---------------------------------------------------------

      - name: Get Gateway config cluster credentials
        run: |
          gcloud container clusters get-credentials \
            gke-primary \
            --region us-east1 \
            --project mohan-sre-assessment-20261001

      - name: Wait for multi-cluster ServiceImport
        run: |
          echo "Waiting for ServiceImport..."

          for i in {1..30}; do
            if kubectl get serviceimport \
              sre-observability-app \
              -n sre-app >/dev/null 2>&1; then

              echo "ServiceImport is available."
              kubectl get serviceimport \
                sre-observability-app \
                -n sre-app
              exit 0
            fi

            echo "ServiceImport not ready yet. Attempt ${i}/30"
            sleep 20
          done

          echo "ServiceImport was not created within 10 minutes."
          exit 1

      - name: Deploy global multi-cluster Gateway
        run: |
          kubectl apply -f kubernetes/gateway/gateway.yaml
          kubectl apply -f kubernetes/gateway/httproute.yaml
          kubectl apply -f kubernetes/gateway/healthcheckpolicy.yaml

      - name: Verify global multi-cluster Gateway
        run: |
          echo "=== ServiceImport ==="
          kubectl get serviceimport \
            sre-observability-app \
            -n sre-app

          echo "=== Gateway ==="
          kubectl get gateway \
            sre-global-gateway \
            -n sre-app

          echo "=== HTTPRoute ==="
          kubectl get httproute \
            sre-observability-route \
            -n sre-app

          echo "=== HealthCheckPolicy ==="
          kubectl get healthcheckpolicy \
            sre-observability-healthcheck \
            -n sre-app
