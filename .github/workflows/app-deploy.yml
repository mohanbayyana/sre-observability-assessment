name: App Deploy

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "kubernetes/app/**"
      - ".github/workflows/app-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build and push application image
        env:
          PROJECT_ID: mohan-sre-assessment-20261001
          REGION: us-east1
          REPOSITORY: app-images
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/sre-observability-app:${GITHUB_SHA}"

          echo "Building image: ${IMAGE_URI}"

          docker build \
            -t "${IMAGE_URI}" \
            app

          docker push "${IMAGE_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            gke-primary \
            --region us-east1 \
            --project mohan-sre-assessment-20261001

      - name: Deploy application
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|g" \
            kubernetes/app/deployment.yaml \
            | kubectl apply -f -

          kubectl apply \
            -f kubernetes/app/service.yaml

      - name: Verify application rollout
        run: |
          kubectl rollout status \
            deployment/sre-observability-app \
            --timeout=5m

          kubectl get pods \
            -l app=sre-observability-app

          kubectl get service \
            sre-observability-app
