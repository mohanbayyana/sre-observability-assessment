name: App Deploy

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "kubernetes/app/**"
      - ".github/workflows/app-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Python syntax
        run: |
          python -m py_compile app/app.py

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          pip install \
            yamllint \
            checkov==3.3.20 \
            pip-audit

      - name: Run YAML lint
        run: |
          yamllint kubernetes/app/deployment.yaml
          yamllint kubernetes/app/service.yaml
          yamllint .github/workflows/app-deploy.yml

      - name: Scan Python dependencies
        run: |
          pip-audit -r app/requirements.txt

      - name: Install actionlint
        run: |
          bash <(
            curl -sSfL \
              https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
          )

      - name: Run actionlint
        run: |
          ./actionlint .github/workflows/app-deploy.yml

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

      - name: Run Checkov Kubernetes scan
        run: |
          checkov \
            -d kubernetes/app \
            --framework kubernetes \
            --compact

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build application image
        env:
          PROJECT_ID: mohan-sre-assessment-20261001
          REGION: us-east1
          REPOSITORY: app-images
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/sre-observability-app:${GITHUB_SHA}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

          docker build \
            -t "${IMAGE_URI}" \
            app

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push application image
        run: |
          docker push "${IMAGE_URI}"

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            gke-primary \
            --region us-east1 \
            --project mohan-sre-assessment-20261001

      - name: Deploy application
        run: |
          kubectl apply -f kubernetes/app/namespace.yaml

          sed "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|g" \
            kubernetes/app/deployment.yaml \
            | kubectl apply -f -

          kubectl apply \
            -f kubernetes/app/service.yaml

      - name: Verify application rollout
        run: |
          kubectl rollout status \
            deployment/sre-observability-app \
            -n sre-app \
            --timeout=5m

          kubectl get pods \
            -n sre-app \
            -l app=sre-observability-app

          kubectl get service \
            sre-observability-app \
            -n sre-app
