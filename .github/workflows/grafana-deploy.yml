name: Grafana Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-grafana:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Verify GKE auth plugin
        run: |
          gke-gcloud-auth-plugin --version

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Read Terraform environment
        id: tfenv
        working-directory: terraform
        run: |
          terraform init -input=false

          PROJECT_ID=$(terraform output -raw project_id)
          REGION=$(terraform output -raw region)
          CLUSTER=$(terraform output -raw gke_cluster_name)

          {
            echo "project_id=$PROJECT_ID"
            echo "region=$REGION"
            echo "cluster=$CLUSTER"
          } >> "$GITHUB_OUTPUT"

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            "${{ steps.tfenv.outputs.cluster }}" \
            --region "${{ steps.tfenv.outputs.region }}" \
            --project "${{ steps.tfenv.outputs.project_id }}"

      - name: Create monitoring namespace
        run: |
          kubectl create namespace monitoring \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create Grafana admin secret
        run: |
          kubectl create secret generic grafana-admin \
            --namespace monitoring \
            --from-literal=admin-user="${{ secrets.GRAFANA_ADMIN_USER }}" \
            --from-literal=admin-password="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Grafana Helm repository
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Deploy Grafana
        run: |
          helm upgrade --install grafana grafana/grafana \
            --namespace monitoring \
            --values kubernetes/observability/grafana/values.yaml

      - name: Verify Grafana rollout
        run: |
          kubectl rollout status deployment/grafana \
            -n monitoring \
            --timeout=5m

      - name: Create Grafana datasource syncer credentials
        env:
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Starting Grafana port-forward..."

          kubectl port-forward \
            -n monitoring \
            svc/grafana \
            3000:80 \
            >/tmp/grafana-port-forward.log 2>&1 &

          PF_PID=$!
          trap 'kill ${PF_PID} || true' EXIT

          GRAFANA_URL="http://127.0.0.1:3000"

          echo "Waiting for Grafana..."

          for i in {1..30}; do
            if curl -fsS "${GRAFANA_URL}/api/health" >/dev/null; then
              echo "Grafana is reachable."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Grafana did not become reachable."
              cat /tmp/grafana-port-forward.log
              exit 1
            fi

            sleep 2
          done

          echo "Checking for Grafana service account..."

          SERVICE_ACCOUNT_ID=$(
            curl -fsS \
              -u "${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}" \
              "${GRAFANA_URL}/api/serviceaccounts/search?query=grafana-datasource-syncer" \
            | jq -r '.serviceAccounts[]? |
                select(.name=="grafana-datasource-syncer") |
                .id' \
            | head -n1
          )

          if [ -z "${SERVICE_ACCOUNT_ID}" ]; then
            echo "Creating Grafana service account..."

            RESPONSE=$(
              curl -fsS \
                -u "${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}" \
                -H "Content-Type: application/json" \
                -X POST \
                -d '{"name":"grafana-datasource-syncer","role":"Admin"}' \
                "${GRAFANA_URL}/api/serviceaccounts"
            )

            SERVICE_ACCOUNT_ID=$(echo "${RESPONSE}" | jq -r '.id')
          fi

          if [ -z "${SERVICE_ACCOUNT_ID}" ] || [ "${SERVICE_ACCOUNT_ID}" = "null" ]; then
            echo "Unable to determine Grafana service account ID."
            exit 1
          fi

          echo "Checking Kubernetes secret..."

          EXISTING_TOKEN=$(
            kubectl get secret grafana-datasource-syncer \
              -n monitoring \
              -o jsonpath='{.data.token}' \
              2>/dev/null || true
          )

          if [ -n "${EXISTING_TOKEN}" ]; then
            echo "Grafana datasource syncer token already exists in Kubernetes."
          else
            echo "Creating Grafana service account token..."

            TOKEN_NAME="datasource-syncer-${GITHUB_RUN_ID}"

            TOKEN_RESPONSE=$(
              curl -fsS \
                -u "${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}" \
                -H "Content-Type: application/json" \
                -X POST \
                -d "{\"name\":\"${TOKEN_NAME}\"}" \
                "${GRAFANA_URL}/api/serviceaccounts/${SERVICE_ACCOUNT_ID}/tokens"
            )

            GRAFANA_TOKEN=$(echo "${TOKEN_RESPONSE}" | jq -r '.key')

            if [ -z "${GRAFANA_TOKEN}" ] || [ "${GRAFANA_TOKEN}" = "null" ]; then
              echo "Failed to generate Grafana service account token."
              exit 1
            fi

            kubectl create secret generic grafana-datasource-syncer \
              --namespace monitoring \
              --from-literal=token="${GRAFANA_TOKEN}" \
              --dry-run=client \
              -o yaml | kubectl apply -f -

            echo "Grafana datasource syncer credentials configured."
          fi

      - name: Deploy Managed Prometheus datasource syncer
        run: |
          kubectl apply \
            -f kubernetes/observability/grafana/gmp-syncer-serviceaccount.yaml

          kubectl apply \
            -f kubernetes/observability/grafana/gmp-datasource-syncer.yaml

      - name: Run datasource syncer immediately
        run: |
          kubectl create job \
            --from=cronjob/datasource-syncer \
            datasource-syncer-${{ github.run_number }} \
            -n monitoring

      - name: Verify datasource syncer
        run: |
          kubectl get cronjob datasource-syncer -n monitoring
          kubectl get jobs -n monitoring
          kubectl get pods -n monitoring
          kubectl get svc -n monitoring
