name: Grafana Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-grafana:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: YOUR_EXISTING_WIF_PROVIDER
          service_account: terraform-github@mohan-sre-assessment-20261001.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials gke-primary \
            --region us-east1 \
            --project mohan-sre-assessment-20261001

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Grafana Helm repo
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Create monitoring namespace
        run: |
          kubectl create namespace monitoring \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Grafana
        run: |
          helm upgrade --install grafana grafana/grafana \
            --namespace monitoring \
            --values kubernetes/observability/grafana/values.yaml

      - name: Verify Grafana rollout
        run: |
          kubectl rollout status deployment/grafana \
            -n monitoring \
            --timeout=5m

      - name: Show Grafana resources
        run: |
          kubectl get pods -n monitoring
          kubectl get svc -n monitoring