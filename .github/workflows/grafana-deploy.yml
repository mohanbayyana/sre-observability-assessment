name: Grafana Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-grafana:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Read Terraform environment
        id: tfenv
        working-directory: terraform
        run: |
          terraform init -input=false

          echo "project_id=$(terraform output -raw project_id)" >> "$GITHUB_OUTPUT"
          echo "region=$(terraform output -raw region)" >> "$GITHUB_OUTPUT"
          echo "cluster=$(terraform output -raw gke_cluster_name)" >> "$GITHUB_OUTPUT"

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            "${{ steps.tfenv.outputs.cluster }}" \
            --region "${{ steps.tfenv.outputs.region }}" \
            --project "${{ steps.tfenv.outputs.project_id }}"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Grafana Helm repository
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Create monitoring namespace
        run: |
          kubectl create namespace monitoring \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Deploy Grafana
        run: |
          helm upgrade --install grafana grafana/grafana \
            --namespace monitoring \
            --values kubernetes/observability/grafana/values.yaml

      - name: Verify Grafana rollout
        run: |
          kubectl rollout status deployment/grafana \
            -n monitoring \
            --timeout=5m

          kubectl get pods -n monitoring
          kubectl get svc -n monitoring